<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E746E">
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gioele">

<style>
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#14302D; --ink-2:#3F5451; --ink-3:#566966;
  --line:#D5E1DF; --line-2:#E7EFED; --brand:#0E746E; --brand-ink:#FFFFFF; --brand-soft:#E0F1EF;
  --warn:#B45309; --warn-soft:#FDF1E3; --bad:#B42318; --bad-soft:#FDECEA; --ok:#1F7A3D; --ok-soft:#E5F4EA;
  --accent:#F2B705;
  --r-lg:16px; --r-md:11px; --r-sm:8px;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1716; --surface:#152321; --ink:#E4EFED; --ink-2:#B9CBC7; --ink-3:#9AAFAB;
    --line:#263A37; --line-2:#1D2E2C; --brand:#3DB8AE; --brand-ink:#06201E; --brand-soft:#16342F;
    --warn:#F0A24B; --warn-soft:#3A2A14; --bad:#F2776C; --bad-soft:#3B1C19; --ok:#5BC47E; --ok-soft:#173222;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1716; --surface:#152321; --ink:#E4EFED; --ink-2:#B9CBC7; --ink-3:#9AAFAB;
  --line:#263A37; --line-2:#1D2E2C; --brand:#3DB8AE; --brand-ink:#06201E; --brand-soft:#16342F;
  --warn:#F0A24B; --warn-soft:#3A2A14; --bad:#F2776C; --bad-soft:#3B1C19; --ok:#5BC47E; --ok-soft:#173222;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* testata */
header.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:10}
:root[data-theme="dark"] header.top{background:#0F3F3B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0F3F3B}}
.top .row{display:flex;align-items:center;gap:12px}
.top img{width:38px;height:38px;border-radius:10px;flex:none}
.top h1{margin:0;font-size:20px;line-height:1.1}
.top .sub{font-size:13px;opacity:.85}
.top .grow{flex:1;min-width:0}
.sync{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}

main.wrap{padding:16px 16px calc(170px + env(safe-area-inset-bottom))}
h2{font-size:18px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.muted{color:var(--ink-2)} .small{font-size:14.5px} .tiny{font-size:13.5px;line-height:1.45;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 14px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.notice{border-radius:var(--r-md);padding:11px 13px;margin:10px 0;font-size:14.5px}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.info{background:var(--brand-soft)} .notice.bad{background:var(--bad-soft);color:var(--bad)}

/* elenchi */
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:9px;cursor:pointer;width:100%;text-align:left}
.item:hover{border-color:var(--brand)}
.date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--brand-soft);color:var(--brand);padding:5px 0;line-height:1.1}
.date b{display:block;font-size:21px}
.date span{font-size:11.5px;font-weight:700;text-transform:uppercase}
.date.past{background:var(--line-2);color:var(--ink-3)}
.item .t{font-weight:700}
.item .m{font-size:14px;color:var(--ink-2)}
.item .grow{flex:1;min-width:0}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--line-2);display:grid;place-items:center;font-size:21px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--ink-2);padding:26px 10px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{flex:1;min-width:140px}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 11px;font-size:16px}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin:11px 0 0;font-size:13.5px;font-weight:700;color:var(--ink-2)}
label.f > input,label.f > select,label.f > textarea{margin-top:4px;font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:15px}
.check input{width:20px;height:20px}

/* barra in basso */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.06);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;min-width:0;max-width:150px;border:0;background:none;padding:8px 2px 9px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .e{font-size:23px;line-height:1.1;filter:grayscale(.6);opacity:.9}
nav.tabs button[aria-current=page]{color:var(--brand);background:var(--brand-soft);border-radius:12px}
nav.tabs button[aria-current=page] .e{filter:none;opacity:1}
.fab{position:fixed;right:max(16px, calc(50vw - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22)}

/* finestra a foglio */
dialog{border:0;padding:0;border-radius:var(--r-lg);width:min(640px,calc(100vw - 20px));max-height:calc(100dvh - 30px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,18,.5)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:var(--line-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.sheet-b{padding:4px 16px 18px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fthumb{position:relative;width:92px;border:1px solid var(--line);border-radius:10px;padding:5px;font-size:11.5px;text-align:center;word-break:break-all;background:var(--bg)}
.fthumb img,.fthumb .pdf{width:80px;height:80px;object-fit:cover;border-radius:7px;display:grid;place-items:center;font-size:30px;background:var(--line-2);margin:0 auto 3px}
.fthumb .del{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:14px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-top:8px}
.kv dt{color:var(--ink-3);font-weight:700;font-size:13.5px;padding-top:1px} .kv dd{margin:0;white-space:pre-wrap}

/* pediatra */
.slot{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:15px}
.slot:first-of-type{border-top:0}
.slot b{min-width:92px}
.days .d{padding:9px 0;border-top:1px solid var(--line-2)}
.days .d:first-child{border-top:0}
.days .d .n{font-weight:700}
@media (max-width:380px){nav.tabs button{font-size:11px}}
.chips-sez{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips-sez::-webkit-scrollbar{display:none}
.chips-sez .btn{flex:none;white-space:nowrap}
.card > svg{display:block;max-width:640px;margin:0 auto}
table.tab{width:100%;border-collapse:collapse;font-size:14.5px}
table.tab th{text-align:left;font-size:12.5px;color:var(--ink-3);padding:6px;border-bottom:1px solid var(--line)}
table.tab td{padding:7px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.campo-errore{outline:3px solid var(--bad)!important;outline-offset:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
ol.steps{padding-left:20px;margin:6px 0} ol.steps li{margin:6px 0}
code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:13.5px;word-break:break-all}

/* ===== due colonne (solo su schermi larghi; sul telefono restano una sotto l'altra) ===== */
.col2 > .col > h2:first-child{margin-top:4px}
/* ===== VISTA DESKTOP / TABLET ORIZZONTALE ===== */
@media (min-width: 900px){
  :root{--lato:236px;--testa:70px}
  header.top{height:var(--testa);padding:0;display:flex;align-items:center;position:fixed;left:0;right:0;top:0}
  header.top .wrap{max-width:none;width:100%;padding:0 24px}
  nav.tabs{top:var(--testa);bottom:0;right:auto;width:var(--lato);flex-direction:column;justify-content:flex-start;gap:4px;
    padding:18px 12px 18px;border-top:0;border-right:1px solid var(--line);box-shadow:none;z-index:9;overflow-y:auto}
  nav.tabs button{flex:none;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15.5px;padding:11px 14px;border-radius:12px;text-align:left}
  nav.tabs button:hover{background:var(--line-2)}
  nav.tabs button .e{font-size:22px;width:28px;text-align:center}
  nav.tabs button[aria-current=page]:hover{background:var(--brand-soft)}
  main.wrap{max-width:1280px;margin:0 auto 0 max(var(--lato), calc(50vw - 640px + var(--lato) / 2));padding:calc(var(--testa) + 22px) 32px 60px}
  .fab{right:32px;bottom:32px;width:60px;height:60px}
  .toast{bottom:40px}
  dialog{width:min(760px,calc(100vw - 40px))}
  #viewer{width:min(1000px,calc(100vw - 40px))}
  /* liste a griglia: le schede una accanto all'altra */
  main#vista{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;align-items:start}
  main#vista > *{grid-column:1 / -1}
  main#vista > .item{grid-column:auto}
  .col2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 26px;align-items:start}
  .col2.stretta-destra{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .item{margin-bottom:12px}
  .chips-sez{margin:0 0 8px;padding-left:0;padding-right:0;flex-wrap:wrap;overflow:visible}
  .empty{padding:40px 10px}
}
@media (min-width: 1400px){
  main#vista{grid-template-columns:repeat(3, minmax(0,1fr))}
  .col2 .item{width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap row">
    <img src="icona-192.png" alt="">
    <div class="grow"><h1>Gioele</h1><div class="sub" id="subtitolo">Visite e documenti</div></div>
    <button class="sync" id="btnSync" type="button">…</button>
  </div>
</header>

<main class="wrap" id="vista"></main>

<button class="fab" id="fab" type="button" aria-label="Aggiungi">+</button>
<nav class="tabs" aria-label="Sezioni">
  <button type="button" data-tab="home"><span class="e">🏠</span>Home</button>
  <button type="button" data-tab="visite"><span class="e">🩺</span>Visite</button>
  <button type="button" data-tab="salute"><span class="e">🌱</span>Salute</button>
  <button type="button" data-tab="documenti"><span class="e">📄</span>Documenti</button>
  <button type="button" data-tab="pediatra"><span class="e">👩‍⚕️</span>Pediatra</button>
  <button type="button" data-tab="impostazioni"><span class="e">⚙️</span>Altro</button>
</nav>

<dialog id="sheet"><form method="dialog" id="sheetForm" novalidate>
  <div class="sheet-h"><h3 id="sheetTitolo"></h3><button class="x" value="annulla" aria-label="Chiudi" formnovalidate>✕</button></div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f" id="sheetFoot"></div>
</form></dialog>

<dialog id="viewer" aria-labelledby="viewerTitolo">
  <div class="sheet-h"><h3 id="viewerTitolo"></h3><button type="button" class="x" id="viewerChiudi" aria-label="Chiudi">✕</button></div>
  <div id="viewerBody" style="padding:10px;overflow:auto;max-height:calc(100dvh - 170px);background:var(--bg)"></div>
  <div class="sheet-f"><a class="btn" id="viewerApri" target="_blank" rel="noopener">↗︎ Apri fuori</a><button type="button" class="btn pri" id="viewerCondividi">💬 Condividi / salva</button></div>
</dialog>
<input type="file" id="inFoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="inFile" accept="application/pdf,image/*,.pdf,.heic" multiple class="hidden">
<input type="file" id="inBackup" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* =====================================================================
   DATI FISSI: la pediatra di Gioele
   ===================================================================== */
const PEDIATRA = {
  nome: "Dr.ssa Lopez Rios Norma Beatriz",
  breve: "Dr.ssa Lopez",
  ruolo: "Pediatra di Famiglia",
  associazione: ["Dr.ssa Erba Daniela", "Dr.ssa Lopez Rios Norma Beatriz", "Dr.ssa Masa Giulia"],
  prenotazioni: { tel: "+393911781054", label: "391 178 1054", giorni: [1,2,3,4,5], fasce: [["09:00","11:00"]] },
  consulti:     { tel: "+393478984952", label: "347 898 4952", giorni: [1,2,3,4,5], fasce: [["08:30","09:30"],["14:00","14:30"]] },
  studi: [
    { id: "sondrio", nome: "Ambulatorio Sondrio", indirizzo: "Via Parolo, 18 – Sondrio",
      orari: { 1: [["10:00","13:00"]], 3: [["15:00","19:00"]], 5: [["09:30","13:30"], ["17:00","19:00","pediatra dell'associazione a turno"]] } },
    { id: "chiesa", nome: "Ambulatorio Chiesa in Valmalenco", indirizzo: "Via Roma, 120 – Chiesa in Valmalenco",
      orari: { 2: [["15:00","19:00"]], 4: [["10:00","13:00"]] } }
  ]
};
const FSE_URL = "https://www.fascicolosanitario.regione.lombardia.it/";
const LUOGHI = [
  "Ambulatorio Sondrio – Via Parolo, 18 – Sondrio",
  "Ambulatorio Chiesa in Valmalenco – Via Roma, 120 – Chiesa in Valmalenco",
  "Ospedale di Sondrio – Via Stelvio, 25 – Sondrio"
];
const TIPI = {
  pediatra: "🩺 Pediatra", bilancio: "📏 Bilancio di salute", specialista: "👨‍⚕️ Specialista",
  ps: "🚑 Pronto soccorso", ricovero: "🛏️ Ricovero", ospedale: "🏥 Ospedale / day hospital", vaccino: "💉 Vaccinazione", esami: "🧪 Esami / analisi", altro: "📌 Altro"
};
const CATEGORIE = {
  esami: "🧪 Esami del sangue / laboratorio", visita: "🩺 Visita specialistica", ps: "🚑 Pronto soccorso",
  dimissione: "🛏️ Ricovero / lettera di dimissione", imaging: "🩻 Ecografia / RX / ECG", vaccini: "💉 Vaccinazioni",
  ricetta: "💊 Ricetta", impegnativa: "📝 Impegnativa", certificato: "📃 Certificato", referto: "📋 Altro referto", altro: "📎 Altro"
};
const CATEGORIE_PERS = {
  nascita: "👶 Certificato / atto di nascita", tessera: "💳 Tessera sanitaria / codice fiscale", identita: "🪪 Carta d'identità",
  passaporto: "🛂 Passaporto", residenza: "🏠 Residenza / stato di famiglia", scuola: "🎒 Nido / scuola",
  esenzione: "📄 Esenzioni / invalidità / 104", isee: "💶 ISEE / assegno unico / bonus", assicurazione: "🛡️ Assicurazione", altro_pers: "📁 Altro documento personale"
};
/* da categoria del documento a tipo di voce nello storico */
const STORICO_DA_CAT = { ps: "ps", dimissione: "ricovero", visita: "specialista", vaccini: "vaccino", esami: "esami", imaging: "esami" };
const STATI = { programmata: "Programmata", fatta: "Fatta", annullata: "Annullata" };
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const GG = ["dom","lun","mar","mer","gio","ven","sab"];
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const NOME_FILE_DATI = "gioele-dati.json";
const NOME_CARTELLA = "Gioele – Salute";
const NOME_CALENDARIO = "Gioele – Visite";
const SCOPE = "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email";

/* =====================================================================
   UTILITÀ
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const oggiISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const min = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const daMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dataLunga = s => { const d = parseISO(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const dataBreve = s => { if (!s) return ""; const d = parseISO(s); return `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
/* errore legato a un campo del modulo: viene evidenziato */
function errore(msg, campo) { const e = new Error(msg); e.campo = campo; return e; }
function mostraErroreSheet(err) {
  let box = document.getElementById("sheetErrore");
  if (!box) { box = document.createElement("div"); box.id = "sheetErrore"; box.className = "notice bad"; box.setAttribute("role", "alert"); $("#sheetBody").prepend(box); }
  box.textContent = "⚠️ " + err.message;
  document.querySelectorAll(".campo-errore").forEach(x => x.classList.remove("campo-errore"));
  const el = err.campo && $("#sheetForm").elements[err.campo];
  if (el) { el.classList.add("campo-errore"); el.scrollIntoView({ block: "center", behavior: "smooth" }); el.addEventListener("input", () => el.classList.remove("campo-errore"), { once: true }); }
  else box.scrollIntoView({ block: "start", behavior: "smooth" });
  toast(err.message, 4000);
}
function toast(msg, ms = 2800) {
  document.querySelectorAll(".toast").forEach(x => x.remove());

let _db;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((ok, ko) => {
    const r = indexedDB.open("gioele-salute", 1);
    r.onupgradeneeded = () => { for (const s of ["kv","file","inbox"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
    r.onsuccess = () => { _db = r.result; ok(_db); }; r.onerror = () => ko(r.error);
  });
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((ok, ko) => {
    const t = d.transaction(store, mode); const s = t.objectStore(store); let out;
    const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => ok(out); t.onerror = () => ko(t.error);
  });
}

/* unione tra due copie (telefono / Drive): per ogni voce vince la modifica più recente */
function unisci(a, b) {
  const out = statoVuoto();
  out.profilo = (a.profilo?.updatedAt || 0) >= (b.profilo?.updatedAt || 0) ? a.profilo : b.profilo;
  out.config = { ...(a.config || {}), ...(b.config || {}) };
  for (const k of COLLEZIONI) {
    const m = new Map();
    for (const x of [...(a[k] || []), ...(b[k] || [])]) {
      const p = m.get(x.id);
      if (!p || (x.updatedAt || 0) > (p.updatedAt || 0)) m.set(x.id, p ? { ...x, files: unisciFiles(p, x) } : x);
      else if (p) m.set(x.id, { ...p, files: unisciFiles(x, p) });
    }
    out[k] = [...m.values()];
  }
  return out;
}

async function gapi(url, opt = {}) {

async function sincronizza(interattivo) {

    const remoto = JSON.parse(await (await driveScarica(fileId)).text() || "{}");

      S = { ...statoVuoto(), ...remoto }; await kvSet("stato", S);
      SY.ultimo = Date.now(); ls.set("ultimoSync", SY.ultimo); SY.stato = "ok"; render(); return;
    }
    const prima = firmaStato(remoto.v ? remoto : statoVuoto());
    S = unisci(S, remoto.v ? remoto : statoVuoto());
    if (!S.config.docsFolderId && S.config.folderId) S.config.docsFolderId = S.config.folderId;
    await caricaAllegatiInSospeso();
    SY.avvisoCal = "";
    try { await preparaCalendario(); SY.daCalendario = ""; await importaDalCalendarioGioele(encodeURIComponent(S.config.calendarId)); await allineaCalendario(); }
    catch (e) { if (e.message === "serve-accesso") throw e; SY.avvisoCal = "Calendario Google non aggiornato: " + e.message; }
    if (firmaStato(S) !== prima) await driveCarica({ id: fileId, blob: new Blob([JSON.stringify(S)], { type: "application/json" }) });
    await kvSet("stato", S);
    SY.ultimo = Date.now(); ls.set("ultimoSync", SY.ultimo); SY.stato = "ok";
    if (interattivo && SY.avvisoCal) toast(SY.avvisoCal, 6000);
    else if (SY.daCalendario) toast("📅 " + SY.daCalendario, 4500);
    render();
  } catch (e) {
    SY.stato = e.message === "serve-accesso" ? "serve-accesso" : "errore";
    SY.errore = e.message === "serve-accesso" ? "" : e.message;
    if (interattivo && SY.errore) toast("Sincronizzazione: " + SY.errore, 5000);
  } finally {
    SY.inCorso = false; aggiornaBadge();
    if (SY.ripeti) { SY.ripeti = false; setTimeout(() => sincronizza(false), 400); }
  }
}

/* ---------- dal calendario "Gioele – Visite" all'app ----------
   Gli eventi inseriti a mano nel calendario (da Simone, da Silvia, dall'iPhone…)
   diventano visite dell'app; se l'evento viene spostato o cancellato nel calendario,
   la visita si aggiorna o diventa "annullata". I promemoria creati dall'app e gli
   eventi ricorrenti (es. vitamina D) non vengono importati. */
function tipoDaTesto(t) {
  t = (t || "").toLowerCase();
  return /bilancio/.test(t) ? "bilancio" : /pediatr|lopez|erba|masa/.test(t) ? "pediatra" : /vaccin|esavalente|pneumococ|meningococ|rotavirus|mprv/.test(t) ? "vaccino"
    : /pronto soccorso|\bps\b/.test(t) ? "ps" : /ricover/.test(t) ? "ricovero" : /esam|prelievo|analisi|ecograf|radiograf|\brx\b|ecg/.test(t) ? "esami"
    : /ospedal|day hospital/.test(t) ? "ospedale" : /visita|specialist|controllo|otorino|oculist|cardiolog|ortoped|dermatolog|neurolog|allergolog/.test(t) ? "specialista" : "altro";
}
function datiDaEvento(e) {
  const s = e.start?.dateTime ? new Date(e.start.dateTime) : e.start?.date ? parseISO(e.start.date) : null;
  if (!s) return null;
  const f = e.end?.dateTime ? new Date(e.end.dateTime) : null;
  return { data: oggiISO(s), ora: e.start.dateTime ? `${pad(s.getHours())}:${pad(s.getMinutes())}` : "",
    durata: f ? Math.max(15, Math.round((f - s) / 60000)) : 30, luogo: e.location || "" };
}
async function importaDalCalendarioGioele(cal) {
  const noti = new Set([...S.visite, ...S.documenti, ...(S.check || [])].map(x => x.calEventId).filter(Boolean));
  const perVisita = new Map(S.visite.filter(v => v.calEventId).map(v => [v.calEventId, v]));
  const da = new Date(); da.setFullYear(da.getFullYear() - 1);
  if (S.profilo.nascita && parseISO(S.profilo.nascita) < da) da.setTime(parseISO(S.profilo.nascita).getTime());
  const a = new Date(); a.setFullYear(a.getFullYear() + 2);
  let eventi = [], token = "";
  for (let i = 0; i < 6; i++) {
    const j = await gapi(`${CAL}/calendars/${cal}/events?${qs({ timeMin: da.toISOString(), timeMax: a.toISOString(), showDeleted: true, singleEvents: false, maxResults: 250, ...(token ? { pageToken: token } : {}) })}`);
    eventi.push(...(j.items || [])); token = j.nextPageToken; if (!token) break;
  }
  let nuove = 0, cambiate = 0;
  for (const e of eventi) {
    const v = perVisita.get(e.id);
    if (v) {   // evento collegato a una visita già nell'app
      if (e.status === "cancelled") {
        if (!v.deleted && v.stato !== "annullata") { Object.assign(v, { stato: "annullata", calEventId: "", calSig: "", updatedAt: Date.now() }); cambiate++; }
        continue;
      }
      if (!v.calUpdated) { v.calUpdated = e.updated; continue; }   // primo controllo: si prende nota e basta
      if (e.updated && e.updated > v.calUpdated) {   // modificato fuori dall'app
        const d = datiDaEvento(e);
        if (d) {
          Object.assign(v, { data: d.data, ora: d.ora, durata: d.durata, luogo: d.luogo || v.luogo });
          if (v.importato && e.summary) v.motivo = e.summary;
          v.calSig = JSON.stringify(eventoDaVisita(v)); v.calUpdated = e.updated; v.updatedAt = Date.now(); cambiate++;
        } else v.calUpdated = e.updated;
      }
      continue;
    }
    if (e.status === "cancelled" || noti.has(e.id) || e.recurrence || e.recurringEventId || e.extendedProperties?.private?.gioele) continue;
    const d = datiDaEvento(e); if (!d) continue;
    const testo = `${e.summary || ""} ${e.description || ""}`, tipo = tipoDaTesto(testo);
    const nv = { id: uid(), tipo, ...d, stato: d.data < oggiISO() ? "fatta" : "programmata",
      medico: ["pediatra", "bilancio"].includes(tipo) ? PEDIATRA.nome : "", motivo: e.summary || "Visita",
      note: (e.description || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 1000),
      importato: true, calEventId: e.id, calUpdated: e.updated || "", noCal: false, creato: Date.now(), creatoDa: G.email || "", updatedAt: Date.now() };
    nv.calSig = d.ora ? JSON.stringify(eventoDaVisita(nv)) : "";
    /* evento di un giorno intero: senza ora l'app non lo modifica e non lo cancella */
    S.visite.push(nv); nuove++;
  }
  if (nuove || cambiate) SY.daCalendario = [nuove && `${nuove} ${nuove === 1 ? "visita aggiunta" : "visite aggiunte"} dal calendario`, cambiate && `${cambiate} ${cambiate === 1 ? "visita aggiornata" : "visite aggiornate"} dal calendario`].filter(Boolean).join(", ");
}
async function allineaCalendario() {
  if (!S.config.calendarId) return;
  const cal = encodeURIComponent(S.config.calendarId);
  for (const v of S.visite) {
    const toglie = v.deleted || v.stato === "annullata" || v.noCal;
    if (toglie) {
      if (v.calEventId) {
        try { await gapi(`${CAL}/calendars/${cal}/events/${v.calEventId}`, { method: "DELETE" }); } catch (e) { if (!/not found|deleted|410|404/i.test(e.message)) throw e; }
        v.calEventId = ""; v.calSig = ""; v.updatedAt = Date.now();
      }

    }
    if (!v.data || !v.ora) continue;
    const ev = eventoDaVisita(v), sig = JSON.stringify(ev);
    if (v.calEventId && v.calSig === sig) continue;
    let r;
    if (v.calEventId) {
      try { r = await gapi(`${CAL}/calendars/${cal}/events/${v.calEventId}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ev) }); }
      catch (e) { if (!/not found|404|410/i.test(e.message)) throw e; }
    }
    if (!r) r = await gapi(`${CAL}/calendars/${cal}/events`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ev) });
    v.calEventId = r.id; v.calSig = sig; v.calUpdated = r.updated || v.calUpdated || ""; v.updatedAt = Date.now();
  }
  await allineaPromemoria(cal);
  await allineaPastiCalendario(cal);
  try { await allineaVitaminaD(cal); } catch (e) { if (e.message === "serve-accesso") throw e; console.warn("vitamina D", e); }
  await allineaProssimoPasto(cal);
  /* scadenze dei documenti personali: evento di un giorno con promemoria 4 settimane e 1 settimana prima */
  for (const d of S.documenti) {
    if (d.ambito !== "personale") continue;
    const toglie = d.deleted || !d.scadenza || d.noCal;
    if (toglie) {
      if (d.calEventId) {
        try { await gapi(`${CAL}/calendars/${cal}/events/${d.calEventId}`, { method: "DELETE" }); } catch (e) { if (!/not found|deleted|410|404/i.test(e.message)) throw e; }
        d.calEventId = ""; d.calSig = ""; d.updatedAt = Date.now();
      }
      continue;
    }
    const ev = eventoScadenza(d), sig = JSON.stringify(ev);
    if (d.calEventId && d.calSig === sig) continue;
    let r;
    if (d.calEventId) {
      try { r = await gapi(`${CAL}/calendars/${cal}/events/${d.calEventId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ev) }); }
      catch (e) { if (!/not found|404|410/i.test(e.message)) throw e; }
    }
    if (!r) r = await gapi(`${CAL}/calendars/${cal}/events`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ev) });
    d.calEventId = r.id; d.calSig = sig; d.updatedAt = Date.now();
  }

/* =====================================================================
   PEDIATRA: orari
   ===================================================================== */
/* ---------- festività italiane + patrono di Sondrio + ferie/chiusure inserite a mano ---------- */
function pasqua(a) {   // calcolo di Meeus/Jones/Butcher
  const A = a % 19, b = Math.floor(a / 100), c = a % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * A + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((A + 11 * h + 22 * l) / 451);
  const mese = Math.floor((h + l - 7 * m + 114) / 31), giorno = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(a, mese - 1, giorno);
}
const _fest = {};
function festivitaAnno(a) {
  if (_fest[a]) return _fest[a];
  const F = { "01-01": "Capodanno", "01-06": "Epifania", "04-25": "Festa della Liberazione", "05-01": "Festa del Lavoro", "06-02": "Festa della Repubblica",
    "06-19": "Santi Gervasio e Protasio (patroni di Sondrio)", "08-15": "Ferragosto", "11-01": "Ognissanti", "12-08": "Immacolata Concezione", "12-25": "Natale", "12-26": "Santo Stefano" };
  if (a >= 2026) F["10-04"] = "San Francesco d'Assisi (festa nazionale)";
  const p = pasqua(a), pm = new Date(a, p.getMonth(), p.getDate() + 1);
  F[`${pad(p.getMonth() + 1)}-${pad(p.getDate())}`] = "Pasqua";
  F[`${pad(pm.getMonth() + 1)}-${pad(pm.getDate())}`] = "Lunedì dell'Angelo (Pasquetta)";
  return (_fest[a] = F);
}
/* motivo per cui la pediatra non riceve quel giorno (festa o ferie), altrimenti "" */
function chiusura(d) {
  const f = festivitaAnno(d.getFullYear())[`${pad(d.getMonth() + 1)}-${pad(d.getDate())}`];
  if (f) return f;
  const iso = oggiISO(d);
  const c = (S.chiusure || []).find(x => !x.deleted && x.da <= iso && iso <= (x.a || x.da));
  return c ? (c.motivo || "Pediatra assente") : "";
}
function fasceDelGiorno(cfg, d) { return cfg.giorni.includes(d.getDay()) && !chiusura(d) ? cfg.fasce : []; }
/* "aperto ora fino alle X" oppure "prossima apertura" */
function statoFascia(cfg, ora = new Date()) {
  const m = ora.getHours() * 60 + ora.getMinutes();
  for (const [a, b] of fasceDelGiorno(cfg, ora)) if (m >= min(a) && m < min(b)) return { aperto: true, fino: b };
  for (let i = 0; i < 8; i++) {
    const d = new Date(ora.getFullYear(), ora.getMonth(), ora.getDate() + i);
    for (const [a] of fasceDelGiorno(cfg, d)) if (i > 0 || min(a) > m) return { aperto: false, giorno: d, da: a, oggi: i === 0, domani: i === 1 };
  }
  return { aperto: false };
}
function fraseProssima(s) {
  if (s.aperto) return `Aperto ora, fino alle ${s.fino}`;
  if (!s.giorno) return "";
  return `Riapre ${s.oggi ? "oggi" : s.domani ? "domani" : GIORNI[s.giorno.getDay()]} alle ${s.da}`;
}
function ambulatoriDelGiorno(d) {
  const out = [];
  if (chiusura(d)) return out;
  for (const st of PEDIATRA.studi) for (const f of st.orari[d.getDay()] || []) out.push({ studio: st, da: f[0], a: f[1], nota: f[2] || "" });
  return out.sort((x, y) => min(x.da) - min(y.da));
}
/* verifica che una visita dalla pediatra cada negli orari di ambulatorio */
function controllaOrarioPediatra(v) {
  if (!["pediatra", "bilancio"].includes(v.tipo) || !v.data || !v.ora) return "";
  const studio = PEDIATRA.studi.find(s => (v.luogo || "").toLowerCase().includes(s.id === "sondrio" ? "parolo" : "valmalenco"));
  if (!studio) return "";
  const d = parseISO(v.data), fasce = studio.orari[d.getDay()] || [];
  const ch = chiusura(d);
  if (ch) return `${GIORNI[d.getDay()][0].toUpperCase() + GIORNI[d.getDay()].slice(1)} ${d.getDate()} ${MESI[d.getMonth()]} la pediatra non riceve: ${ch}.`;
  if (!fasce.length) {
    const giorni = Object.keys(studio.orari).map(g => GIORNI[g]).join(" e ");
    return `Di ${GIORNI[d.getDay()]} l'${studio.nome} è chiuso (è aperto ${giorni}).`;
  }
  const m = min(v.ora);
  const f = fasce.find(([a, b]) => m >= min(a) && m < min(b));
  if (!f) return `Orario fuori ambulatorio: di ${GIORNI[d.getDay()]} ${studio.nome} è aperto ${fasce.map(x => x[0] + "–" + x[1]).join(" e ")}.`;
  if (f[2]) return `Attenzione: venerdì ${f[0]}–${f[1]} visita il ${f[2]}.`;
  return "";
}

function etichettaVisita(v) {

/* =====================================================================
   ALLEGATI: recupero del file (telefono o Drive)
   ===================================================================== */
const urlCache = new Map();
async function blobAllegato(f) {
  let b = await fileGet(f.fid);
  if (!b && f.driveId) {
    if (!tokenValido()) await accedi(true);
    b = await driveScarica(f.driveId);
    if (f.mime && b.type !== f.mime) b = new Blob([b], { type: f.mime });
    await fileSet(f.fid, b);
  }
  return b || null;
}
async function urlAllegato(f) {
  if (urlCache.has(f.fid)) return urlCache.get(f.fid);
  const b = await blobAllegato(f); if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(f.fid, u); return u;
}
/* riduce le foto molto grandi per non riempire Drive */
async function preparaFile(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5e6) return file;
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}

function eta(nascita) {
  const n = parseISO(nascita), o = new Date();
  let mesi = (o.getFullYear() - n.getFullYear()) * 12 + o.getMonth() - n.getMonth() - (o.getDate() < n.getDate() ? 1 : 0);
  if (mesi < 0) return "";
  if (mesi < 1) { const g = Math.round((parseISO(oggiISO()) - n) / 864e5); return g === 1 ? "1 giorno" : g + " giorni"; }
  if (mesi < 24) return mesi + (mesi === 1 ? " mese" : " mesi");
  const a = Math.floor(mesi / 12), r = mesi % 12;
  return a + " anni" + (r ? " e " + r + (r === 1 ? " mese" : " mesi") : "");
}

async function analizzaBozza() {

    if (mio !== analisiInCorso || !$("#boxAnalisi")) return;
    bozzaAnalisi = a; disegnaAnalisi(); applicaAnalisi(a); suggerisciPersonale(a);
  } catch (e) {
    if ($("#boxAnalisi")) $("#boxAnalisi").innerHTML = `<div class="notice warn">Non sono riuscito a leggere il documento: ${esc(e.message)}. Compila tu i campi.</div>`;

/* ---------- visualizzatore interno di foto e PDF ----------
   Su iPhone, con l'app installata, aprire i file in una nuova finestra spesso non funziona:
   qui si mostrano dentro l'app (PDF disegnati pagina per pagina con pdf.js). */
const viewer = $("#viewer");
let viewerFile = null, viewerUrl = "";
async function mostraFile(blob, nome = "documento") {
  if (!blob) return toast("File non disponibile", 4000);
  const mime = blob.type || (/\.pdf$/i.test(nome) ? "application/pdf" : "");
  viewerFile = new File([blob], nome, { type: mime || "application/octet-stream" });
  if (viewerUrl) URL.revokeObjectURL(viewerUrl);
  viewerUrl = URL.createObjectURL(viewerFile);
  $("#viewerTitolo").textContent = nome;
  $("#viewerApri").href = viewerUrl;
  const corpo = $("#viewerBody");
  if (/^image\//.test(mime)) corpo.innerHTML = `<img src="${viewerUrl}" alt="${esc(nome)}" style="display:block;max-width:100%;margin:0 auto;border-radius:8px">`;
  else if (mime === "application/pdf") {
    corpo.innerHTML = `<div class="small muted" id="viewerStato">Apro il PDF…</div>`;
    if (!viewer.open) viewer.showModal();
    try {
      const lib = await libPdfjs(), doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
      const n = Math.min(doc.numPages, 40), larg = Math.min(corpo.clientWidth - 20 || 340, 900);
      $("#viewerStato").textContent = doc.numPages > n ? `Prime ${n} pagine di ${doc.numPages}` : `${doc.numPages} ${doc.numPages === 1 ? "pagina" : "pagine"}`;
      for (let i = 1; i <= n; i++) {
        if (!viewer.open || viewerFile.name !== nome) return;
        const pg = await doc.getPage(i), vp0 = pg.getViewport({ scale: 1 }), k = larg / vp0.width, vp = pg.getViewport({ scale: k * Math.min(2, window.devicePixelRatio || 1) });
        const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; c.style.cssText = "display:block;width:100%;margin:0 auto 10px;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)";
        corpo.appendChild(c);
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) { corpo.innerHTML = `<div class="notice warn">Non riesco a mostrare il PDF qui (${esc(e.message)}). Usa “Condividi / salva” per aprirlo con un'altra app.</div>`; }
    return;
  } else corpo.innerHTML = `<div class="notice info">Questo tipo di file non si può vedere qui: usa “Condividi / salva”.</div>`;
  if (!viewer.open) viewer.showModal();
}
$("#viewerChiudi").addEventListener("click", () => viewer.close());
viewer.addEventListener("close", () => { $("#viewerBody").innerHTML = ""; });
$("#viewerCondividi").addEventListener("click", async () => {
  if (!viewerFile) return;
  if (navigator.canShare?.({ files: [viewerFile] })) { try { await navigator.share({ files: [viewerFile], title: viewerFile.name }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = viewerUrl; a.download = viewerFile.name; document.body.appendChild(a); a.click(); a.remove();
});
async function apriFile(f) {
  try {
    const b = f.blob || await blobAllegato(f);
    if (!b) return toast("File non disponibile: è sul telefono dell'altro genitore e non è ancora stato caricato su Drive.", 5000);
    await mostraFile(f.mime && b.type !== f.mime ? new Blob([b], { type: f.mime }) : b, f.nome);
  } catch (e) { toast(e.message === "serve-accesso" ? "Accedi a Google per scaricare il file" : e.message, 5000); }

function giorniA(iso) { return Math.round((parseISO(iso) - parseISO(oggiISO())) / 86400000); }

  const blob = new Blob([JSON.stringify({ ...S, allegati })], { type: "application/json" });
  const nome = `gioele-backup-${oggiISO()}.json`;
  const file = new File([blob], nome, { type: "application/json" });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: nome }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
}
async function importa(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j.v || !Array.isArray(j.visite)) throw new Error("File non valido");
    for (const [fid, data] of Object.entries(j.allegati || {})) await fileSet(fid, await (await fetch(data)).blob());
    delete j.allegati;
    S = unisci(S, j); await salva();
    toast("Copia importata");
  } catch (e) { toast("Importazione non riuscita: " + e.message, 5000); }
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;

  if (await azioneSalute(act, b, e)) return;
  switch (act) {
    case "tab": e.preventDefault(); vai(b.dataset.tab); break;
    case "nuova-visita": formVisita(); break;
    case "nuova-visita-ped": formVisita({}, { tipo: "pediatra" }); break;
    case "nota-consulto": formVisita({}, { tipo: "pediatra", data: oggiISO(), ora: `${pad(new Date().getHours())}:${pad(new Date().getMinutes() - new Date().getMinutes() % 5)}`, durata: 15, stato: "fatta", luogo: "Consulto telefonico", medico: PEDIATRA.nome, noCal: true }); break;
    case "apri-visita": formVisita(S.visite.find(v => v.id === id)); break;
    case "apri-doc": { e.preventDefault(); const d = S.documenti.find(x => x.id === id); d.ambito === "personale" ? formDocPers(d) : formDoc(d); break; }
    case "doc-ambito": filtroDoc.ambito = b.dataset.amb; ls.set("docAmbito", filtroDoc.ambito); render(); break;
    case "doc-personali": e.preventDefault(); filtroDoc.ambito = "personali"; ls.set("docAmbito", "personali"); vai("documenti"); break;
    case "nuovo-pers": formDocPers({}, { categoria: b.dataset.cat || "altro_pers" }); break;
    case "passa-personale": formDocPers({}, { _files: bozzaFiles.slice(), _analisi: { ...analizzaTestoPersonale(bozzaAnalisi.testo, S.profilo.nascita), testo: bozzaAnalisi.testo } }); break;
    case "doc-per-visita": { const v = S.visite.find(x => x.id === id);
      formDoc({}, { visitaId: id, data: v.data, struttura: v.medico || (v.luogo || "").split(" – ")[0], categoria: v.tipo === "esami" ? "esami" : "referto", _tornaVisita: id }); break; }
    case "profilo": e.preventDefault(); formProfilo(); break;
    case "scatta": $("#inFoto").click(); break;
    case "scegli": $("#inFile").click(); break;
    case "togli-file": bozzaFiles.splice(+b.dataset.i, 1); disegnaBozza(); break;
    case "apri-file": e.preventDefault(); apriFile(bozzaFiles[+b.dataset.i]); break;
    case "elimina-visita": {
      const v = S.visite.find(x => x.id === id);
      if (!confirm(`Eliminare la visita del ${dataBreve(v.data)}? (i documenti collegati restano)`)) return;
      Object.assign(v, { deleted: true, updatedAt: Date.now() }); sheet.close(); await salva(); toast("Visita eliminata"); break;
    }
    case "elimina-doc": {
      const d = S.documenti.find(x => x.id === id);
      if (!confirm(`Eliminare “${d.titolo}”?${d.files?.some(f => f.driveId) ? " Il file resta comunque nella cartella Drive." : ""}`)) return;
      Object.assign(d, { deleted: true, updatedAt: Date.now() }); sheet.close(); await salva(); toast("Documento eliminato"); break;
    }
    case "condividi-visita": { const v = S.visite.find(x => x.id === id); condividi({ titolo: "Visita di Gioele", testo: testoVisita(v) }); break; }
    case "condividi-doc": {
      const d = S.documenti.find(x => x.id === id);
      b.disabled = true; b.textContent = "Preparo…";
      try {
        const files = [];
        for (const f of d.files || []) { const bl = await blobAllegato(f); if (bl) files.push(new File([bl], f.nome, { type: f.mime })); }
        b.disabled = false; b.textContent = "💬 Invia ora";
        b.dataset.act = "condividi-doc-pronto"; b._files = files;   // serve un secondo tocco: la condivisione vuole un gesto “fresco”
        if (navigator.userActivation?.isActive) { condividi({ titolo: d.titolo, testo: `📄 ${d.titolo} – Gioele${d.data ? " (" + dataBreve(d.data) + ")" : ""}`, files }); }
      } catch (err) { b.disabled = false; b.textContent = "💬 Invia a Silvia / al medico"; toast(err.message === "serve-accesso" ? "Accedi a Google per scaricare il file" : err.message, 5000); }
      break;
    }
    case "condividi-doc-pronto": { const d = S.documenti.find(x => x.id === id); condividi({ titolo: d.titolo, testo: `📄 ${d.titolo} – Gioele${d.data ? " (" + dataBreve(d.data) + ")" : ""}`, files: b._files || [] }); break; }
    case "importa-cal": importaDaCalendario(); break;
    case "analizza": if (!bozzaFiles.length) toast("Prima aggiungi una foto o un PDF"); else if (modoDoc === "personale") analizzaBozzaPers(); else { $("#rigaStorico") && delete $("#rigaStorico").dataset.toccato; analizzaBozza(); } break;
    case "riepilogo": formRiepilogo(); break;
    case "riepilogo-apri": if (ultimoRiepilogo) mostraFile(ultimoRiepilogo, ultimoRiepilogo.name); break;
    case "condividi-riepilogo": if (ultimoRiepilogo) condividi({ titolo: ultimoRiepilogo.name, testo: "Riepilogo sanitario di Gioele", files: [ultimoRiepilogo] }); break;
    case "riepilogo-drive":
      b.disabled = true;
      try { await accedi(true); await driveCarica({ nome: ultimoRiepilogo.name, mime: "application/pdf", parents: [S.config.folderId], blob: ultimoRiepilogo }); toast("Salvato nella cartella Drive “" + NOME_CARTELLA + "”"); }
      catch (err) { toast("Non salvato: " + err.message, 5000); } finally { b.disabled = false; }
      break;
    case "nuova-chiusura": formChiusura(); break;
    case "togli-chiusura": { const c = S.chiusure.find(x => x.id === id); if (c && confirm("Togliere questa chiusura?")) { Object.assign(c, { deleted: true, updatedAt: Date.now() }); await salva(); } break; }
    case "sync": case "collega": sincronizza(true); break;
    case "salva-cid": {
      /* accetta anche il codice incollato con https://, spazi, barre o testo intorno */
      /* trattini "tipografici" e caratteri invisibili che il copia-incolla a volte inserisce */
      const pulito = $("#inCid").value.replace(/[\u2010-\u2015\u2212\uFE58\uFE63\uFF0D]/g, "-").replace(/[\s\u00AD\u200B-\u200D\u2060\uFEFF]+/g, "");
      const m = pulito.match(/\d+-[a-z0-9]+\.apps\.googleusercontent\.com/i);
      if (!m) {
        if (/\.apps\.googleusercontent\.com/i.test(pulito)) return toast("Il Client ID è incompleto: deve cominciare con dei numeri e un trattino (es. 123456789012-abc….apps.googleusercontent.com). Ricopialo intero dalla console Google.", 7000);
        return toast("Non trovo il Client ID: deve finire con .apps.googleusercontent.com", 5000);
      }
      const v = m[0].toLowerCase().replace(/^(\d+-)/, "$1"); $("#inCid").value = v;
      ls.set("clientId", v); render(); sincronizza(true); break;
    }
    case "condividi-silvia": {
      const em = $("#inEmailSilvia").value.trim();
      if (!/^\S+@\S+\.\S+$/.test(em)) return toast("Scrivi un indirizzo email valido");
      ls.set("emailSilvia", em);
      b.disabled = true;
      const ruolo = $("#inRuolo")?.value || "writer";
      try { await condividiArchivio(em, ruolo); toast(`Condiviso con ${em} ${ruolo === "reader" ? "(sola lettura)" : ""} ✓`); riempiAccessi(); }
      catch (err) { toast("Condivisione non riuscita: " + err.message, 6000); }
      finally { b.disabled = false; }
      break;
    }
    case "link-silvia": {
      const link = `${location.origin}${location.pathname}#cid=${encodeURIComponent(clientId())}`;
      condividi({ titolo: "App Gioele", testo: `Ciao! Questa è l'app con le visite e i referti di Gioele 👶🩺\nAprila, tocca “Accedi” con il tuo account Google e vedi tutto:\n${link}\n(Su iPhone: Condividi → Aggiungi alla schermata Home)` });
      break;
    }
    case "scollega":
      if (!confirm("Scollegare Google da questo telefono? I dati restano su Drive e su questo telefono.")) return;
      ["collegato", "fileId", "email", "giaAutorizzato"].forEach(ls.del);
      if (G.token && window.google?.accounts) google.accounts.oauth2.revoke(G.token, () => {});
      G.token = null; G.email = ""; ls.del("tok");
      SY.stato = "locale"; render(); break;
    case "esporta": esporta(); break;
    case "cambia-cid":
      if (!confirm("Cambiare il Client ID? Dovrai incollarlo di nuovo e rifare l'accesso a Google. I dati di Gioele non vengono toccati.")) return;
      ["clientId", "collegato", "fileId", "giaAutorizzato", "tok", "email"].forEach(ls.del);
      G.token = null; G.email = ""; G.gisPronto = null; SY.stato = "locale"; SY.errore = ""; render(); break;
    case "salva-mio-nome": ls.set("mioNome", $("#inMioNome").value.trim()); toast("Salvato"); break;
    case "chiudi-installa": ls.set("noBannerInstalla", true); render(); break;
    case "importa": $("#inBackup").click(); break;
  }
});
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => vai(b.dataset.tab)));

  "nuova-febbre", "nuova-spesa", "nuovo-pers", "doc-per-visita", "farmaci-abituali", "scatta-nuovo", "pdf-nuovo", "condividi-silvia", "importa", "importa-cal", "nuova-visita-bil", "elimina-voce", "nuovo-pasto", "vitd-data", "pannolino-rapido", "nuovo-pannolino", "poppata-avvia", "poppata-cambia", "poppata-fine", "pasti-regola", "pasti-nascita", "elimina-visita", "elimina-doc"]);

   ===================================================================== */
async function controllaInbox() {
  const voci = await idb("inbox", "readonly", s => s.getAll());
  if (!voci?.length) return;
  await idb("inbox", "readwrite", s => s.clear());
  const files = voci.flatMap(v => v.files || []);
  if (!files.length) return;
  vai("documenti");
  formDoc({}, { titolo: voci[0].titolo || "" });
  aggiungiFiles(files);
  toast("File ricevuto: completa i dati e salva");
}
(async function avvio() {
  /* aspetta che siano caricati anche analisi.js, riepilogo.js, oms.js e salute.js */
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, { once: true }));
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("cid")) { if (CID_RE.test(h.get("cid"))) ls.set("clientId", h.get("cid")); history.replaceState(null, "", location.pathname); vista = "impostazioni"; }
  try { const s = await kvGet("stato"); if (s && s.v) S = { ...statoVuoto(), ...s }; } catch (e) { console.warn(e); }
  if (googleAttivo()) SY.stato = tokenValido() ? "da-fare" : "serve-accesso";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if (googleAttivo() && tokenValido()) sincronizza(false);
  await controllaInbox();
  if (new URLSearchParams(location.search).has("ricevuto")) history.replaceState(null, "", location.pathname);
})();
