<style>
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#14302D; --ink-2:#4B605D; --ink-3:#7C8E8B;
  --line:#D5E1DF; --line-2:#E7EFED; --brand:#0E746E; --brand-ink:#FFFFFF; --brand-soft:#E0F1EF;
  --warn:#B45309; --warn-soft:#FDF1E3; --bad:#B42318; --bad-soft:#FDECEA; --ok:#1F7A3D; --ok-soft:#E5F4EA;
  --accent:#F2B705;
  --r-lg:16px; --r-md:11px; --r-sm:8px;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1716; --surface:#152321; --ink:#E4EFED; --ink-2:#A9BDB9; --ink-3:#7A8F8B;
    --line:#263A37; --line-2:#1D2E2C; --brand:#3DB8AE; --brand-ink:#06201E; --brand-soft:#16342F;
    --warn:#F0A24B; --warn-soft:#3A2A14; --bad:#F2776C; --bad-soft:#3B1C19; --ok:#5BC47E; --ok-soft:#173222;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1716; --surface:#152321; --ink:#E4EFED; --ink-2:#A9BDB9; --ink-3:#7A8F8B;
  --line:#263A37; --line-2:#1D2E2C; --brand:#3DB8AE; --brand-ink:#06201E; --brand-soft:#16342F;
  --warn:#F0A24B; --warn-soft:#3A2A14; --bad:#F2776C; --bad-soft:#3B1C19; --ok:#5BC47E; --ok-soft:#173222;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* testata */
header.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:10}
:root[data-theme="dark"] header.top{background:#0F3F3B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0F3F3B}}
.top .row{display:flex;align-items:center;gap:12px}
.top img{width:38px;height:38px;border-radius:10px;flex:none}
.top h1{margin:0;font-size:20px;line-height:1.1}
.top .sub{font-size:13px;opacity:.85}
.top .grow{flex:1;min-width:0}
.sync{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}

main{padding:16px 0 calc(96px + env(safe-area-inset-bottom))}
h2{font-size:18px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.muted{color:var(--ink-2)} .small{font-size:13.5px} .tiny{font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 14px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.notice{border-radius:var(--r-md);padding:11px 13px;margin:10px 0;font-size:14.5px}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.info{background:var(--brand-soft)} .notice.bad{background:var(--bad-soft);color:var(--bad)}

/* elenchi */
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:9px;cursor:pointer;width:100%;text-align:left}
.item:hover{border-color:var(--brand)}
.date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--brand-soft);color:var(--brand);padding:5px 0;line-height:1.1}
.date b{display:block;font-size:21px}
.date span{font-size:11.5px;font-weight:700;text-transform:uppercase}
.date.past{background:var(--line-2);color:var(--ink-3)}
.item .t{font-weight:700}
.item .m{font-size:14px;color:var(--ink-2)}
.item .grow{flex:1;min-width:0}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--line-2);display:grid;place-items:center;font-size:21px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--ink-3);padding:26px 10px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{flex:1;min-width:140px}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 11px;font-size:16px}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin:11px 0 0;font-size:13.5px;font-weight:700;color:var(--ink-2)}
label.f > input,label.f > select,label.f > textarea{margin-top:4px;font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:15px}
.check input{width:20px;height:20px}

/* barra in basso */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;max-width:150px;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;font-weight:700;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .e{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
nav.tabs button[aria-current=page]{color:var(--brand)}
nav.tabs button[aria-current=page] .e{filter:none;opacity:1}
.fab{position:fixed;right:max(16px, calc(50vw - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22)}

/* finestra a foglio */
dialog{border:0;padding:0;border-radius:var(--r-lg);width:min(640px,calc(100vw - 20px));max-height:calc(100dvh - 30px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,18,.5)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:var(--line-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.sheet-b{padding:4px 16px 18px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fthumb{position:relative;width:92px;border:1px solid var(--line);border-radius:10px;padding:5px;font-size:11.5px;text-align:center;word-break:break-all;background:var(--bg)}
.fthumb img,.fthumb .pdf{width:80px;height:80px;object-fit:cover;border-radius:7px;display:grid;place-items:center;font-size:30px;background:var(--line-2);margin:0 auto 3px}
.fthumb .del{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:14px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-top:8px}
.kv dt{color:var(--ink-3);font-weight:700;font-size:13.5px;padding-top:1px} .kv dd{margin:0;white-space:pre-wrap}

/* pediatra */
.slot{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:15px}
.slot:first-of-type{border-top:0}
.slot b{min-width:92px}
.days .d{padding:9px 0;border-top:1px solid var(--line-2)}
.days .d:first-child{border-top:0}
.days .d .n{font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
ol.steps{padding-left:20px;margin:6px 0} ol.steps li{margin:6px 0}
code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:13.5px;word-break:break-all}
</style>
</head>

<header class="top">
  <div class="wrap row">
    <img src="icona-192.png" alt="">
    <div class="grow"><h1>Gioele</h1><div class="sub" id="subtitolo">Visite e documenti</div></div>

</header>

<main class="wrap" id="vista"></main>

<button class="fab" id="fab" type="button" aria-label="Aggiungi">+</button>

<script>
"use strict";
/* =====================================================================
   DATI FISSI: la pediatra di Gioele
   ===================================================================== */
const PEDIATRA = {
  nome: "Dr.ssa Lopez Rios Norma Beatriz",
  breve: "Dr.ssa Lopez",
  ruolo: "Pediatra di Famiglia",
  associazione: ["Dr.ssa Erba Daniela", "Dr.ssa Lopez Rios Norma Beatriz", "Dr.ssa Masa Giulia"],
  prenotazioni: { tel: "+393911781054", label: "391 178 1054", giorni: [1,2,3,4,5], fasce: [["09:00","11:00"]] },
  consulti:     { tel: "+393478984952", label: "347 898 4952", giorni: [1,2,3,4,5], fasce: [["08:30","09:30"],["14:00","14:30"]] },
  studi: [
    { id: "sondrio", nome: "Ambulatorio Sondrio", indirizzo: "Via Parolo, 18 – Sondrio",
      orari: { 1: [["10:00","13:00"]], 3: [["15:00","19:00"]], 5: [["09:30","13:30"], ["17:00","19:00","pediatra dell'associazione a turno"]] } },
    { id: "chiesa", nome: "Ambulatorio Chiesa in Valmalenco", indirizzo: "Via Roma, 120 – Chiesa in Valmalenco",
      orari: { 2: [["15:00","19:00"]], 4: [["10:00","13:00"]] } }
  ]
};
const FSE_URL = "https://www.fascicolosanitario.regione.lombardia.it/";
const LUOGHI = [
  "Ambulatorio Sondrio – Via Parolo, 18 – Sondrio",
  "Ambulatorio Chiesa in Valmalenco – Via Roma, 120 – Chiesa in Valmalenco",
  "Ospedale di Sondrio – Via Stelvio, 25 – Sondrio"
];
const TIPI = {
  pediatra: "🩺 Pediatra", bilancio: "📏 Bilancio di salute", specialista: "👨‍⚕️ Specialista",
  ospedale: "🏥 Ospedale / Pronto soccorso", vaccino: "💉 Vaccinazione", esami: "🧪 Esami / analisi", altro: "📌 Altro"
};
const CATEGORIE = {
  referto: "📋 Referto", ricetta: "💊 Ricetta", impegnativa: "📝 Impegnativa", esami: "🧪 Esami / analisi",
  dimissione: "🏥 Lettera di dimissione", certificato: "📃 Certificato", vaccini: "💉 Vaccinazioni", altro: "📎 Altro"
};
const STATI = { programmata: "Programmata", fatta: "Fatta", annullata: "Annullata" };
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const GG = ["dom","lun","mar","mer","gio","ven","sab"];
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const NOME_FILE_DATI = "gioele-dati.json";
const NOME_CARTELLA = "Gioele – Salute";
const NOME_CALENDARIO = "Gioele – Visite";
const SCOPE = "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email";

/* =====================================================================
   UTILITÀ
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const oggiISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const min = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const daMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dataLunga = s => { const d = parseISO(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
const dataBreve = s => { if (!s) return ""; const d = parseISO(s); return `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; };
function toast(msg, ms = 2800) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem("gioele." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gioele." + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("gioele." + k); } catch {} }
};

/* =====================================================================
   ARCHIVIO SUL TELEFONO (IndexedDB)
   ===================================================================== */
let _db;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((ok, ko) => {
    const r = indexedDB.open("gioele-salute", 1);
    r.onupgradeneeded = () => { for (const s of ["kv","file","inbox"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
    r.onsuccess = () => { _db = r.result; ok(_db); }; r.onerror = () => ko(r.error);
  });
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((ok, ko) => {
    const t = d.transaction(store, mode); const s = t.objectStore(store); let out;
    const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => ok(out); t.onerror = () => ko(t.error);
  });
}
const kvGet = k => idb("kv", "readonly", s => s.get(k));
const kvSet = (k, v) => idb("kv", "readwrite", s => s.put(v, k));
const fileGet = k => idb("file", "readonly", s => s.get(k));
const fileSet = (k, v) => idb("file", "readwrite", s => s.put(v, k));
const fileDel = k => idb("file", "readwrite", s => s.delete(k));

/* =====================================================================
   STATO
   ===================================================================== */
function statoVuoto() {
  return { v: 1, profilo: { nome: "Gioele", updatedAt: 0 }, visite: [], documenti: [], config: {} };
}
let S = statoVuoto();
let vista = ls.get("tab", "home");
let filtroDoc = { q: "", cat: "" };
let filtroVis = { q: "", quando: "future" };

const visiteAttive = () => S.visite.filter(v => !v.deleted);
const docAttivi = () => S.documenti.filter(d => !d.deleted);
async function salva(spingi = true) {
  await kvSet("stato", S);
  render();
  if (spingi) pianificaSync();
}

/* unione tra due copie (telefono / Drive): per ogni voce vince la modifica più recente */
function unisci(a, b) {
  const out = statoVuoto();
  out.profilo = (a.profilo?.updatedAt || 0) >= (b.profilo?.updatedAt || 0) ? a.profilo : b.profilo;
  out.config = { ...(a.config || {}), ...(b.config || {}) };
  for (const k of ["visite", "documenti"]) {
    const m = new Map();
    for (const x of [...(a[k] || []), ...(b[k] || [])]) {
      const p = m.get(x.id);
      if (!p || (x.updatedAt || 0) > (p.updatedAt || 0)) m.set(x.id, p ? { ...x, files: unisciFiles(p, x) } : x);
      else if (p) m.set(x.id, { ...p, files: unisciFiles(x, p) });
    }
    out[k] = [...m.values()];
  }
  return out;
}
/* tiene l'eventuale driveId già noto per un allegato */
function unisciFiles(vecchio, nuovo) {
  if (!nuovo.files) return nuovo.files;
  const ids = new Map((vecchio.files || []).map(f => [f.fid, f.driveId]));
  return nuovo.files.map(f => f.driveId || !ids.get(f.fid) ? f : { ...f, driveId: ids.get(f.fid) });
}
const firmaStato = s => JSON.stringify({ p: s.profilo, c: s.config, v: s.visite, d: s.documenti });

/* =====================================================================
   GOOGLE: accesso, Drive, Calendar
   ===================================================================== */
const G = { token: null, exp: 0, email: ls.get("email", ""), client: null, gisPronto: null };
(function () { const t = (() => { ls.get("tok") })();
  if (t && t.exp > Date.now() + 60000) { G.token = t.token; G.exp = t.exp; } })();
const clientId = () => ls.get("clientId", "");
const googleAttivo = () => !!clientId() && !!ls.get("collegato", false);
const tokenValido = () => G.token && G.exp > Date.now() + 60000;

function caricaGIS() {
  if (G.gisPronto) return G.gisPronto;
  G.gisPronto = new Promise((ok, ko) => {
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ok; s.onerror = () => { G.gisPronto = null; ko(new Error("Impossibile caricare l'accesso Google (sei offline?)")); };
    document.head.appendChild(s);
  });
  return G.gisPronto;
}
async function accedi(interattivo = true) {
  if (tokenValido()) return G.token;
  if (!interattivo) throw new Error("serve-accesso");
  await caricaGIS();
  return new Promise((ok, ko) => {
    const c = google.accounts.oauth2.initTokenClient({
      client_id: clientId(), scope: SCOPE, hint: G.email || undefined,
      callback: r => {
        if (r.error) return ko(new Error(r.error_description || r.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...SCOPE.split(" "))) return ko(new Error("Per funzionare servono tutti i permessi (Drive e Calendar): riprova e spunta tutte le caselle."));
        G.token = r.access_token; G.exp = Date.now() + (r.expires_in - 60) * 1000;
        ls.set("tok", { token: G.token, exp: G.exp });
        ok(G.token);
      },
      error_callback: e => ko(new Error(e.type === "popup_closed" ? "Accesso annullato" : (e.message || "Accesso non riuscito")))
    });
    c.requestAccessToken({ prompt: ls.get("giaAutorizzato", false) ? "" : "consent" });
  });
}
async function gapi(url, opt = {}) {
  if (!tokenValido()) throw new Error("serve-accesso");
  const r = await fetch(url, { ...opt, headers: { Authorization: "Bearer " + G.token, ...(opt.headers || {}) } });
  if (r.status === 401) { G.token = null; ls.del("tok"); throw new Error("serve-accesso"); }
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { const j = await r.json(); msg = j.error?.message || msg; } catch {}
    throw new Error(msg);
  }

const DRIVE = "https://www.googleapis.com/drive/v3", UP = "https://www.googleapis.com/upload/drive/v3", CAL = "https://www.googleapis.com/calendar/v3";

async function driveCerca(q, fields = "files(id,name,modifiedTime,parents,owners(emailAddress))") {
  const j = await gapi(`${DRIVE}/files?${qs({ q, fields, pageSize: 50, orderBy: "modifiedTime desc", supportsAllDrives: true, includeItemsFromAllDrives: true })}`);
  return j.files || [];
}
async function driveCarica({ id, nome, mime, parents, blob }) {

  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  fd.append("file", blob, nome || "file");
  const url = id ? `${UP}/files/${id}?uploadType=multipart&supportsAllDrives=true&fields=id` : `${UP}/files?uploadType=multipart&supportsAllDrives=true&fields=id`;
  return gapi(url, { method: id ? "PATCH" : "POST", body: fd });
}
const driveScarica = id => gapi(`${DRIVE}/files/${id}?alt=media&supportsAllDrives=true`, { blob: true, cache: "no-store" });

async function preparaArchivio(creaSeManca) {

    if (firmaStato(S) !== prima) await driveCarica({ id: fileId, blob: new Blob([JSON.stringify(S)], { type: "application/json" }) });
    await kvSet("stato", S);
    SY.ultimo = Date.now(); ls.set("ultimoSync", SY.ultimo); SY.stato = "ok";

}
async function caricaAllegatiInSospeso() {
  for (const d of S.documenti) {
    if (d.deleted || !d.files) continue;
    for (const f of d.files) {
      if (f.driveId) continue;
      const blob = await fileGet(f.fid);
      if (!blob) continue;  // il file è sul telefono dell'altro genitore: lo caricherà lui
      const nome = `${d.data || ""} ${d.titolo || "documento"} – ${f.nome}`.trim().replace(/[\\/]/g, "-");
      const r = await driveCarica({ nome, mime: f.mime, parents: [S.config.docsFolderId || S.config.folderId], blob });
      f.driveId = r.id; d.updatedAt = Date.now();
    }
  }
}
async function allineaCalendario() {
  if (!S.config.calendarId) return;

  for (const v of S.visite) {
    const toglie = v.deleted || v.stato === "annullata" || v.noCal;

      if (v.calEventId) {
        try { await gapi(`${CAL}/calendars/${cal}/events/${v.calEventId}`, { method: "DELETE" }); } catch (e) { if (!/not found|deleted|410|404/i.test(e.message)) throw e; }
        v.calEventId = ""; v.calSig = ""; v.updatedAt = Date.now();

      catch (e) { if (!/not found|404|410/i.test(e.message)) throw e; }

}

function fasceDelGiorno(cfg, d) { return cfg.giorni.includes(d.getDay()) ? cfg.fasce : []; }
/* "aperto ora fino alle X" oppure "prossima apertura" */
function statoFascia(cfg, ora = new Date()) {
  const m = ora.getHours() * 60 + ora.getMinutes();
  for (const [a, b] of fasceDelGiorno(cfg, ora)) if (m >= min(a) && m < min(b)) return { aperto: true, fino: b };
  for (let i = 0; i < 8; i++) {
    const d = new Date(ora.getFullYear(), ora.getMonth(), ora.getDate() + i);
    for (const [a] of fasceDelGiorno(cfg, d)) if (i > 0 || min(a) > m) return { aperto: false, giorno: d, da: a, oggi: i === 0, domani: i === 1 };
  }
  return { aperto: false };
}
function fraseProssima(s) {
  if (s.aperto) return `Aperto ora, fino alle ${s.fino}`;
  if (!s.giorno) return "";
  return `Riapre ${s.oggi ? "oggi" : s.domani ? "domani" : GIORNI[s.giorno.getDay()]} alle ${s.da}`;
}
function ambulatoriDelGiorno(d) {
  const out = [];
  for (const st of PEDIATRA.studi) for (const f of st.orari[d.getDay()] || []) out.push({ studio: st, da: f[0], a: f[1], nota: f[2] || "" });
  return out.sort((x, y) => min(x.da) - min(y.da));
}
/* verifica che una visita dalla pediatra cada negli orari di ambulatorio */
function controllaOrarioPediatra(v) {
  if (!["pediatra", "bilancio"].includes(v.tipo) || !v.data || !v.ora) return "";
  const studio = PEDIATRA.studi.find(s => (v.luogo || "").toLowerCase().includes(s.id === "sondrio" ? "parolo" : "valmalenco"));
  if (!studio) return "";
  const d = parseISO(v.data), fasce = studio.orari[d.getDay()] || [];
  if (!fasce.length) {
    const giorni = Object.keys(studio.orari).map(g => GIORNI[g]).join(" e ");
    return `Di ${GIORNI[d.getDay()]} l'${studio.nome} è chiuso (è aperto ${giorni}).`;
  }
  const m = min(v.ora);
  const f = fasce.find(([a, b]) => m >= min(a) && m < min(b));
  if (!f) return `Orario fuori ambulatorio: di ${GIORNI[d.getDay()]} ${studio.nome} è aperto ${fasce.map(x => x[0] + "–" + x[1]).join(" e ")}.`;
  if (f[2]) return `Attenzione: venerdì ${f[0]}–${f[1]} visita il ${f[2]}.`;
  return "";
}

   ===================================================================== */
const urlCache = new Map();
async function blobAllegato(f) {
  let b = await fileGet(f.fid);
  if (!b && f.driveId) {
    if (!tokenValido()) await accedi(true);
    b = await driveScarica(f.driveId);
    if (f.mime && b.type !== f.mime) b = new Blob([b], { type: f.mime });
    await fileSet(f.fid, b);
  }
  return b || null;
}
async function urlAllegato(f) {
  if (urlCache.has(f.fid)) return urlCache.get(f.fid);
  const b = await blobAllegato(f); if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(f.fid, u); return u;
}
/* riduce le foto molto grandi per non riempire Drive */
async function preparaFile(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5e6) return file;
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}

function eta(nascita) {
  const n = parseISO(nascita), o = new Date();
  let mesi = (o.getFullYear() - n.getFullYear()) * 12 + o.getMonth() - n.getMonth() - (o.getDate() < n.getDate() ? 1 : 0);
  if (mesi < 0) return "";
  if (mesi < 24) return mesi + (mesi === 1 ? " mese" : " mesi");
  const a = Math.floor(mesi / 12), r = mesi % 12;
  return a + " anni" + (r ? " e " + r + (r === 1 ? " mese" : " mesi") : "");
}

    <label class="f">Esito / cosa ha detto il medico<textarea name="esito" placeholder="Diagnosi, terapia, prossimi controlli…">${esc(v.esito || "")}</textarea></label>
    <label class="f">Note (cosa portare, domande da fare…)<textarea name="note">${esc(v.note || "")}</textarea></label>
    ${googleAttivo() ? `<label class="check"><input type="checkbox" name="cal" ${v.noCal ? "" : "checked"}> Metti nel calendario Google “${NOME_CALENDARIO}”</label>` : ""}
    ${!nuova ? `<h3 style="font-size:16px;margin:18px 0 6px">📎 Documenti della visita</h3>
      ${docs.length ? docs.map(rigaDoc).join("") : `<div class="tiny">Nessun documento collegato.</div>`}
      <div class="btns">
        <button type="button" class="btn sm" data-act="doc-per-visita" data-id="${v.id}">+ Aggiungi referto / documento</button>
        <button type="button" class="btn sm" data-act="condividi-visita" data-id="${v.id}">💬 Invia a Silvia</button>
        ${v.data && v.ora && !googleAttivo() ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(linkCalendarioGoogle(v))}">📅 Aggiungi a Google Calendar</a>` : ""}
      </div>` : ""}
  `, `${!nuova ? `<button type="button" class="btn bad" data-act="elimina-visita" data-id="${v.id}">Elimina</button><span style="flex:1"></span>` : ""}
      <button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pri" value="ok">Salva</button>`,
  async () => {
    const f = $("#sheetForm"), val = n => f.elements[n]?.value.trim() ?? "";
    if (!val("data")) throw new Error("Indica la data");
    const dati = { tipo: val("tipo"), data: val("data"), ora: val("ora"), durata: +val("durata") || 30, stato: val("stato"), luogo: val("luogo"),
      medico: val("medico"), motivo: val("motivo"), esito: val("esito"), note: val("note"), noCal: f.elements.cal ? !f.elements.cal.checked : !!v.noCal };
    if (nuova) S.visite.push({ id: uid(), ...dati, creato: Date.now(), creatoDa: G.email || "", updatedAt: Date.now() });
    else Object.assign(S.visite.find(x => x.id === v.id), dati, { updatedAt: Date.now() });
    await salva();
    toast(nuova ? "Visita salvata" : "Modifiche salvate");
    if (nuova && !googleAttivo() && dati.ora) setTimeout(() => toast("Suggerimento: apri la visita e tocca “Aggiungi a Google Calendar”", 4000), 2900);
  });
  const f = $("#sheetForm");
  const verifica = () => {
    const x = { tipo: f.elements.tipo.value, data: f.elements.data.value, ora: f.elements.ora.value, luogo: f.elements.luogo.value };
    const a = controllaOrarioPediatra(x);
    $("#avvisoOrario").innerHTML = a ? `<div class="notice warn">⚠️ ${esc(a)}</div>` : "";
  };

    if (["pediatra", "bilancio"].includes(f.elements.tipo.value) && !f.elements.medico.value) f.elements.medico.value = PEDIATRA.nome;
    if (["pediatra", "bilancio"].includes(f.elements.tipo.value) && !f.elements.luogo.value) f.elements.luogo.value = luogoPerData(f.elements.data.value);
    verifica();
  });
  f.elements.data.addEventListener("change", () => {
    if (["pediatra", "bilancio"].includes(f.elements.tipo.value)) { const l = luogoPerData(f.elements.data.value); if (l && LUOGHI.slice(0, 2).includes(f.elements.luogo.value)) f.elements.luogo.value = l; }
    verifica();
  });
  ["ora", "luogo"].forEach(n => f.elements[n].addEventListener("change", verifica));
  if (nuova && ["pediatra", "bilancio"].includes(v.tipo)) {
    if (!v.medico) f.elements.medico.value = PEDIATRA.nome;
    if (!v.luogo) f.elements.luogo.value = luogoPerData(f.elements.data.value);
  }
  verifica();
}
/* l'ambulatorio aperto in quel giorno della settimana */
function luogoPerData(iso) {
  if (!iso) return "";
  const g = parseISO(iso).getDay();
  if (PEDIATRA.studi[0].orari[g]) return LUOGHI[0];
  if (PEDIATRA.studi[1].orari[g]) return LUOGHI[1];
  return "";
}

/* ---------- documento ---------- */
let bozzaFiles = [];  // {fid, nome, mime, size, blob?, nuovo}
function formDoc(d = {}, preset = {}) {
  d = { categoria: "referto", data: oggiISO(), ...preset, ...d };
  const nuovo = !d.id;
  bozzaFiles = (d.files || []).map(f => ({ ...f }));
  if (preset._files) bozzaFiles.push(...preset._files);
  const visite = visiteAttive().sort((a, b) => b.data.localeCompare(a.data));
  apriSheet(nuovo ? "Nuovo documento" : "Documento", `
    <div class="files" id="bozzaFiles"></div>
    <div class="btns">
      <button type="button" class="btn sm" data-act="scatta">📷 Fotografa</button>
      <button type="button" class="btn sm" data-act="scegli">📁 Scegli file / PDF</button>
    </div>
    <label class="f">Titolo<input type="text" name="titolo" value="${esc(d.titolo || "")}" placeholder="es. Referto ecografia delle anche" required></label>
    <div class="grid2">
      <label class="f">Categoria<select name="categoria">${Object.entries(CATEGORIE).map(([k, t]) => `<option value="${k}" ${d.categoria === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="f">Data del documento<input type="date" name="data" value="${esc(d.data || "")}"></label>
    </div>
    <label class="f">Struttura / medico<input type="text" name="struttura" list="dlLuoghi2" value="${esc(d.struttura || "")}"></label>
    <datalist id="dlLuoghi2">${[...new Set([PEDIATRA.nome, ...LUOGHI.map(l => l.split(" – ")[0]), ...docAttivi().map(x => x.struttura).filter(Boolean)])].map(l => `<option value="${esc(l)}">`).join("")}</datalist>
    <label class="f">Visita collegata<select name="visitaId"><option value="">— nessuna —</option>${visite.map(v => `<option value="${v.id}" ${d.visitaId === v.id ? "selected" : ""}>${dataBreve(v.data)} · ${esc(etichettaVisita(v))}</option>`).join("")}</select></label>
    <label class="f">Note<textarea name="note" placeholder="es. valori da ricontrollare fra 3 mesi">${esc(d.note || "")}</textarea></label>
    ${!nuovo ? `<div class="btns"><button type="button" class="btn sm" data-act="condividi-doc" data-id="${d.id}">💬 Invia a Silvia / al medico</button></div>` : ""}
  `, `${!nuovo ? `<button type="button" class="btn bad" data-act="elimina-doc" data-id="${d.id}">Elimina</button><span style="flex:1"></span>` : ""}
      <button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pri" value="ok">Salva</button>`,
  async () => {
    const f = $("#sheetForm"), val = n => f.elements[n]?.value.trim() ?? "";
    if (!bozzaFiles.length) throw new Error("Aggiungi almeno una foto o un file");
    const titolo = val("titolo") || (CATEGORIE[val("categoria")] || "Documento").replace(/^\S+\s/, "");
    for (const x of bozzaFiles) if (x.blob) { await fileSet(x.fid, x.blob); }
    const files = bozzaFiles.map(({ fid, nome, mime, size, driveId }) => ({ fid, nome, mime, size, ...(driveId ? { driveId } : {}) }));
    const dati = { titolo, categoria: val("categoria"), data: val("data"), struttura: val("struttura"), visitaId: val("visitaId"), note: val("note"), files, updatedAt: Date.now() };
    if (nuovo) S.documenti.push({ id: uid(), ...dati, creato: Date.now(), creatoDa: G.email || "" });
    else {
      const old = S.documenti.find(x => x.id === d.id);
      for (const of of old.files || []) if (!files.some(n => n.fid === of.fid)) fileDel(of.fid);
      Object.assign(old, dati);
    }
    await salva();
    toast(googleAttivo() ? "Documento salvato: lo carico su Drive per Silvia" : "Documento salvato");
    const tornaA = preset._tornaVisita;
    if (tornaA) { const v = S.visite.find(x => x.id === tornaA); if (v) { setTimeout(() => formVisita(v), 50); } }
  });
  disegnaBozza();
}
async function disegnaBozza() {
  const el = $("#bozzaFiles"); if (!el) return;
  el.innerHTML = bozzaFiles.length ? "" : `<div class="tiny">Nessun file: fotografa il referto (anche più pagine) o scegli un PDF.</div>`;
  for (const [i, f] of bozzaFiles.entries()) {
    const div = document.createElement("div"); div.className = "fthumb";
    const img = /^image\//.test(f.mime);
    div.innerHTML = `<div class="pdf">${img ? "🖼️" : "📄"}</div><a href="#" data-act="apri-file" data-i="${i}">${esc(f.nome.length > 24 ? f.nome.slice(0, 21) + "…" : f.nome)}</a><button type="button" class="del" data-act="togli-file" data-i="${i}" aria-label="Togli">✕</button>`;
    el.appendChild(div);
    if (img) {
      const b = f.blob || await fileGet(f.fid);
      if (b) { const u = URL.createObjectURL(b); div.querySelector(".pdf").outerHTML = `<img alt="" src="${u}">`; }
    }
  }
}
async function aggiungiFiles(list) {
  for (const file of list) {
    const p = await preparaFile(file);
    bozzaFiles.push({ fid: uid(), nome: p.name || "foto.jpg", mime: p.type || "application/octet-stream", size: p.size, blob: p, nuovo: true });
  }
  const t = $("#sheetForm").elements.titolo;
  if (t && !t.value && bozzaFiles.length === 1 && bozzaFiles[0].mime === "application/pdf") t.value = bozzaFiles[0].nome.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ");
  disegnaBozza();
}
async function apriFile(f) {
  const w = window.open("", "_blank");  // aperta subito (altrimenti iPhone la blocca)
  try {
    const u = f.blob ? URL.createObjectURL(f.blob) : await urlAllegato(f);
    if (!u) { w?.close(); return toast("File non disponibile: è sul telefono dell'altro genitore e non è ancora stato caricato su Drive.", 5000); }
    if (w) w.location.href = u; else location.href = u;
  } catch (e) { w?.close(); toast(e.message === "serve-accesso" ? "Accedi a Google per scaricare il file" : e.message, 5000); }
}

/* ---------- profilo ---------- */
function formProfilo() {
  const p = S.profilo;

/* ---------- importa dal calendario personale ---------- */
async function importaDaCalendario() {
  if (!clientId()) return toast("Prima collega Google in Impostazioni", 4000);
  try { await accedi(true); } catch (e) { return toast(e.message, 4000); }
  const da = new Date(); da.setFullYear(da.getFullYear() - 2);
  const a = new Date(); a.setFullYear(a.getFullYear() + 1);
  let ev = [];
  try {
    for (const q of ["Gioele", "pediatra", "Lopez"]) {
      const j = await gapi(`${CAL}/calendars/primary/events?${qs({ q, timeMin: da.toISOString(), timeMax: a.toISOString(), singleEvents: true, orderBy: "startTime", maxResults: 250 })}`);
      ev.push(...(j.items || []));
    }
  } catch (e) { return toast(e.message, 5000); }
  const noti = new Set(S.visite.map(v => v.importDa).filter(Boolean));
  ev = [...new Map(ev.map(e => [e.id, e])).values()].filter(e => !noti.has(e.id) && e.start);
  apriSheet("Importa dal calendario", ev.length ? `<p class="small muted">Eventi del tuo calendario principale che parlano di Gioele o della pediatra. Spunta quelli da importare come visite.</p>
    ${ev.map(e => { const s = e.start.dateTime || e.start.date; return `<label class="check"><input type="checkbox" name="ev" value="${esc(e.id)}"> <span><b>${esc(e.summary || "(senza titolo)")}</b><br><span class="tiny">${new Date(s).toLocaleString("it-IT", { dateStyle: "medium", timeStyle: e.start.dateTime ? "short" : undefined })}${e.location ? " · " + esc(e.location) : ""}</span></span></label>`; }).join("")}`
    : `<div class="empty">Nessun evento trovato con “Gioele”, “pediatra” o “Lopez” negli ultimi 2 anni.</div>`,
  `<button class="btn" value="annulla" formnovalidate>Chiudi</button>${ev.length ? `<button class="btn pri" value="ok">Importa</button>` : ""}`,
  async () => {
    const scelti = [...$("#sheetForm").querySelectorAll("input[name=ev]:checked")].map(i => i.value);
    for (const id of scelti) {
      const e = ev.find(x => x.id === id), s = e.start.dateTime ? new Date(e.start.dateTime) : parseISO(e.start.date);
      const fine = e.end?.dateTime ? new Date(e.end.dateTime) : null;
      const testo = (e.summary || "").toLowerCase();
      const tipo = /pediatr|lopez|bilancio/.test(testo) ? "pediatra" : /vaccin/.test(testo) ? "vaccino" : /esam|prelievo|analisi/.test(testo) ? "esami" : /ospedal|pronto/.test(testo) ? "ospedale" : "specialista";
      S.visite.push({ id: uid(), tipo, data: oggiISO(s), ora: e.start.dateTime ? `${pad(s.getHours())}:${pad(s.getMinutes())}` : "", durata: fine ? Math.max(15, Math.round((fine - s) / 60000)) : 30,
        stato: s < new Date() ? "fatta" : "programmata", luogo: e.location || "", medico: tipo === "pediatra" ? PEDIATRA.nome : "", motivo: e.summary || "", note: e.description ? e.description.replace(/<[^>]+>/g, " ").slice(0, 1000) : "",
        importDa: e.id, noCal: s < new Date(), creato: Date.now(), updatedAt: Date.now() });
    }
    await salva();
    toast(`${scelti.length} visite importate`);
  });
}

/* ---------- copia di sicurezza ---------- */
const b64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function esporta() {
  const allegati = {};
  for (const d of docAttivi()) for (const f of d.files || []) { const b = await fileGet(f.fid); if (b) allegati[f.fid] = await b64(b); }
  const blob = new Blob([JSON.stringify({ ...S, allegati })], { type: "application/json" });
  const nome = `gioele-backup-${oggiISO()}.json`;
  const file = new File([blob], nome, { type: "application/json" });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: nome }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
}
async function importa(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j.v || !Array.isArray(j.visite)) throw new Error("File non valido");
    for (const [fid, data] of Object.entries(j.allegati || {})) await fileSet(fid, await (await fetch(data)).blob());
    delete j.allegati;
    S = unisci(S, j); await salva();
    toast("Copia importata");
  } catch (e) { toast("Importazione non riuscita: " + e.message, 5000); }
}

/* =====================================================================
   EVENTI
   ===================================================================== */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (b.tagName === "A" && b.getAttribute("href") === "#") e.preventDefault();
  switch (act) {
    case "tab": e.preventDefault(); vai(b.dataset.tab); break;
    case "nuova-visita": formVisita(); break;
    case "nuova-visita-ped": formVisita({}, { tipo: "pediatra" }); break;
    case "nota-consulto": formVisita({}, { tipo: "pediatra", data: oggiISO(), ora: `${pad(new Date().getHours())}:${pad(new Date().getMinutes() - new Date().getMinutes() % 5)}`, durata: 15, stato: "fatta", luogo: "Consulto telefonico", medico: PEDIATRA.nome, noCal: true }); break;
    case "apri-visita": formVisita(S.visite.find(v => v.id === id)); break;
    case "apri-doc": formDoc(S.documenti.find(d => d.id === id)); break;
    case "doc-per-visita": { const v = S.visite.find(x => x.id === id);
      formDoc({}, { visitaId: id, data: v.data, struttura: v.medico || (v.luogo || "").split(" – ")[0], categoria: v.tipo === "esami" ? "esami" : "referto", _tornaVisita: id }); break; }
    case "profilo": formProfilo(); break;
    case "scatta": $("#inFoto").click(); break;
    case "scegli": $("#inFile").click(); break;
    case "togli-file": bozzaFiles.splice(+b.dataset.i, 1); disegnaBozza(); break;
    case "apri-file": e.preventDefault(); apriFile(bozzaFiles[+b.dataset.i]); break;
    case "elimina-visita": {
      const v = S.visite.find(x => x.id === id);
      if (!confirm(`Eliminare la visita del ${dataBreve(v.data)}? (i documenti collegati restano)`)) return;
      Object.assign(v, { deleted: true, updatedAt: Date.now() }); sheet.close(); await salva(); toast("Visita eliminata"); break;
    }
    case "elimina-doc": {
      const d = S.documenti.find(x => x.id === id);
      if (!confirm(`Eliminare “${d.titolo}”?${d.files?.some(f => f.driveId) ? " Il file resta comunque nella cartella Drive." : ""}`)) return;
      Object.assign(d, { deleted: true, updatedAt: Date.now() }); sheet.close(); await salva(); toast("Documento eliminato"); break;
    }
    case "condividi-visita": { const v = S.visite.find(x => x.id === id); condividi({ titolo: "Visita di Gioele", testo: testoVisita(v) }); break; }
    case "condividi-doc": {
      const d = S.documenti.find(x => x.id === id);
      b.disabled = true; b.textContent = "Preparo…";
      try {
        const files = [];
        for (const f of d.files || []) { const bl = await blobAllegato(f); if (bl) files.push(new File([bl], f.nome, { type: f.mime })); }
        b.disabled = false; b.textContent = "💬 Invia ora";
        b.dataset.act = "condividi-doc-pronto"; b._files = files;   // serve un secondo tocco: la condivisione vuole un gesto “fresco”
        if (navigator.userActivation?.isActive) { condividi({ titolo: d.titolo, testo: `📄 ${d.titolo} – Gioele${d.data ? " (" + dataBreve(d.data) + ")" : ""}`, files }); }
      } catch (err) { b.disabled = false; b.textContent = "💬 Invia a Silvia / al medico"; toast(err.message === "serve-accesso" ? "Accedi a Google per scaricare il file" : err.message, 5000); }
      break;
    }
    case "condividi-doc-pronto": { const d = S.documenti.find(x => x.id === id); condividi({ titolo: d.titolo, testo: `📄 ${d.titolo} – Gioele${d.data ? " (" + dataBreve(d.data) + ")" : ""}`, files: b._files || [] }); break; }
    case "importa-cal": importaDaCalendario(); break;
    case "sync": case "collega": sincronizza(true); break;
    case "salva-cid": {
      const v = $("#inCid").value.trim();
      if (!/^[\w-]+\.apps\.googleusercontent\.com$/.test(v)) return toast("Il Client ID deve finire con .apps.googleusercontent.com", 4000);
      ls.set("clientId", v); render(); sincronizza(true); break;
    }
    case "condividi-silvia": {
      const em = $("#inEmailSilvia").value.trim();
      if (!/^\S+@\S+\.\S+$/.test(em)) return toast("Scrivi un indirizzo email valido");
      ls.set("emailSilvia", em);
      b.disabled = true;
      try { await condividiArchivio(em); toast("Condiviso con " + em + " ✓"); riempiAccessi(); }
      catch (err) { toast("Condivisione non riuscita: " + err.message, 6000); }
      finally { b.disabled = false; }
      break;
    }
    case "link-silvia": {
      const link = `${location.origin}${location.pathname}#cid=${encodeURIComponent(clientId())}`;
      condividi({ titolo: "App Gioele", testo: `Ciao! Questa è l'app con le visite e i referti di Gioele 👶🩺\nAprila, tocca “Accedi” con il tuo account Google e vedi tutto:\n${link}\n(Su iPhone: Condividi → Aggiungi alla schermata Home)` });
      break;
    }
    case "scollega":
      if (!confirm("Scollegare Google da questo telefono? I dati restano su Drive e su questo telefono.")) return;
      ["collegato", "fileId", "email", "giaAutorizzato"].forEach(ls.del);
      if (G.token && window.google?.accounts) google.accounts.oauth2.revoke(G.token, () => {});
      G.token = null; G.email = ""; ls.del("tok");
      SY.stato = "locale"; render(); break;
    case "esporta": esporta(); break;
    case "importa": $("#inBackup").click(); break;
  }
});
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => vai(b.dataset.tab)));
function vai(tab) { vista = tab; ls.set("tab", tab); render(); window.scrollTo(0, 0); }
$("#fab").addEventListener("click", () => {
  if (vista === "documenti") return formDoc();
  if (vista === "visite" || vista === "pediatra") return formVisita();
  apriSheet("Aggiungi", `<div class="btns" style="flex-direction:column">
      <button type="button" class="btn pri" data-act="nuova-visita">🩺 Nuova visita / appuntamento</button>
      <button type="button" class="btn" data-act="scatta-nuovo">📷 Fotografa un referto</button>
      <button type="button" class="btn" data-act="pdf-nuovo">📄 Carica un PDF / file</button>
      <button type="button" class="btn" data-act="nota-consulto">📞 Annota un consulto telefonico</button></div>`,
    `<button class="btn" value="annulla" formnovalidate>Chiudi</button>`, null);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act=scatta-nuovo],[data-act=pdf-nuovo]"); if (!b) return;
  formDoc(); (b.dataset.act === "scatta-nuovo" ? $("#inFoto") : $("#inFile")).click();
});
$("#inFoto").addEventListener("change", e => { aggiungiFiles([...e.target.files]); e.target.value = ""; });
$("#inFile").addEventListener("change", e => { aggiungiFiles([...e.target.files]); e.target.value = ""; });
$("#inBackup").addEventListener("change", e => { if (e.target.files[0]) importa(e.target.files[0]); e.target.value = ""; });
document.addEventListener("input", e => {
  if (e.target.id === "qDoc") { filtroDoc.q = e.target.value; rinfrescaConFocus("qDoc"); }
  if (e.target.id === "qVis") { filtroVis.q = e.target.value; rinfrescaConFocus("qVis"); }
});
document.addEventListener("change", e => {
  if (e.target.id === "catDoc") { filtroDoc.cat = e.target.value; render(); }
  if (e.target.id === "quandoVis") { filtroVis.quando = e.target.value; render(); }
});
function rinfrescaConFocus(id) {
  const el = $("#" + id), pos = el.selectionStart; render();
  const n = $("#" + id); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
}
$("#btnSync").addEventListener("click", () => clientId() ? sincronizza(true) : vai("impostazioni"));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && googleAttivo() && tokenValido()) sincronizza(false); });
setInterval(() => { if (document.visibilityState === "visible" && googleAttivo() && tokenValido()) sincronizza(false); }, 90000);
setInterval(() => { if (["home", "pediatra"].includes(vista) && !sheet.open) render(); }, 60000);

/* =====================================================================
   AVVIO
   ===================================================================== */
async function controllaInbox() {
  const voci = await idb("inbox", "readonly", s => s.getAll());
  if (!voci?.length) return;
  await idb("inbox", "readwrite", s => s.clear());
  const files = voci.flatMap(v => v.files || []);
  if (!files.length) return;
  vai("documenti");
  formDoc({}, { titolo: voci[0].titolo || "" });
  aggiungiFiles(files);
  toast("File ricevuto: completa i dati e salva");
}
(async function avvio() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("cid")) { ls.set("clientId", h.get("cid")); history.replaceState(null, "", location.pathname); vista = "impostazioni"; }
  try { const s = await kvGet("stato"); if (s && s.v) S = { ...statoVuoto(), ...s }; } catch (e) { console.warn(e); }
  if (googleAttivo()) SY.stato = tokenValido() ? "da-fare" : "serve-accesso";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if (googleAttivo() && tokenValido()) sincronizza(false);
  await controllaInbox();
  if (new URLSearchParams(location.search).has("ricevuto")) history.replaceState(null, "", location.pathname);
})();
